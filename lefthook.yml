pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,mjs,json,md,yml,yaml}"
      exclude: "docs/**"
      run: pnpm exec oxfmt --check {staged_files}
      fail_text: "Run 'pnpm format' to fix formatting."
    lint:
      glob: "*.{ts,tsx,js,mjs,mts,cts}"
      run: pnpm exec oxlint {staged_files}
      fail_text: "Run 'pnpm lint' to fix lint errors."
    boundaries:
      glob: "apps/*/src/**/*.{ts,tsx}"
      run: node tools/module-boundaries/cli.js
      fail_text: "Module boundary broken: see docs/internal/agent-rules/modules.md."
