name: OTA publish

# Publishes the mobile JS bundle to the `production` channel of EAS Update
# (ADR 0025). Runs after every merge to main that can change the bundle. An
# update only reaches binaries whose runtime version (the native fingerprint)
# matches, so before publishing this looks for a finished `production`-profile
# EAS build of the same fingerprint on each platform. A native change has none:
# nothing is published, and this workflow reports "needs a native build" on the
# job and the merged PR.
#
# SECURITY: this job holds EXPO_TOKEN, which can publish to every phone and
# simulator running the production binary. It must only ever run reviewed code
# from main. Never add pull_request, pull_request_target, or any other trigger
# that runs a branch or a fork here. A workflow_dispatch from another branch
# runs the build check only; the publish step is gated on refs/heads/main.
#
# Setup (secrets, variables): docs/internal/DELIVERY.md, "CI and OTA
# publishing". Runbook: docs/internal/OTA.md.

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - pnpm-lock.yaml
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Print the fingerprints and look for their builds, publish nothing
        type: boolean
        default: false

permissions: {}

# One publish at a time and never cut one off halfway. GitHub keeps at most one
# run waiting: a newer merge replaces a waiting one, which is fine, because it
# builds from a later main that contains the replaced commit.
concurrency:
  group: ota-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    permissions:
      actions: read # wait for CI's `check` on this commit
      checks: read # or prove it from the merged PR head's `check` (scripts/ci/wait-for-check.sh)
      contents: read
      pull-requests: read # find the merged PR of this commit
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: production
      # One build profile (docs/internal/DEVICES.md): the binaries link appduct
      # (APPDUCT_ENABLED=1, also set by eas.json), and the variable changes the
      # iOS fingerprint, so fingerprints and bundles are computed with it too.
      # Rozenite is a dev-only Metro plugin: WITH_ROZENITE stays empty here,
      # so the bundle carries none of it.
      APPDUCT_ENABLED: "1"
      WITH_ROZENITE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the version from package.json's packageManager pin.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up EAS CLI
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: 27.4.1
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      # The fingerprint reads the installed native packages, and the bundle
      # build needs the app's devDependencies (Metro config helpers).
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Describe the commit
        id: commit
        run: |
          subject=$(git log -1 --format=%s)
          short=$(git rev-parse --short HEAD)
          pr=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" \
            -q '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty' || true)
          {
            echo "short=$short"
            echo "pr=$pr"
            # The update message is the merge commit subject plus the short sha.
            echo "message<<EOF_MESSAGE"
            echo "$subject ($short)"
            echo "EOF_MESSAGE"
          } >>"$GITHUB_OUTPUT"

      # Per platform: the fingerprint of this commit, and whether a finished
      # `production` build with it exists on EAS.
      - name: Look for a production build of each fingerprint
        id: builds
        working-directory: apps/mobile
        run: |
          result=ready
          for platform in ios android; do
            hash=$(eas fingerprint:generate --platform "$platform" --build-profile production \
              --json --non-interactive | jq -r .hash)
            if ! [[ $hash =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=$platform fingerprint failed::eas fingerprint:generate returned no hash."
              exit 1
            fi
            found=$(eas build:list --platform "$platform" --build-profile production \
              --status finished --fingerprint-hash "$hash" --limit 1 --json --non-interactive | jq length)
            if [ "$found" -gt 0 ]; then
              status=build-found
            else
              status=needs-native-build
              result=needs-native-build
              echo "::error title=$platform needs a native build::No finished production build has fingerprint $hash. Not published."
            fi
            echo "$platform: $hash $status"
            {
              echo "${platform}_fingerprint=$hash"
              echo "${platform}_status=$status"
            } >>"$GITHUB_OUTPUT"
          done
          echo "result=$result" >>"$GITHUB_OUTPUT"

      # Skipped at once when the merge commit's tree is the tree of the merged PR's head and
      # that head's check passed (a squash merge of an up-to-date branch: the same code, already
      # tested); otherwise waits for CI on this commit (ADR 0009).
      - name: Wait for CI's check on this commit
        if: github.ref == 'refs/heads/main' && !inputs.preflight_only && steps.builds.outputs.result == 'ready'
        run: scripts/ci/wait-for-check.sh "$GITHUB_SHA" 25

      # EXPO_PUBLIC_API_URL and the rest of the bundle's public environment come
      # from the `production` EAS environment (--environment), the same one the
      # production binary was built with.
      - name: Publish to EAS Update
        id: publish
        if: github.ref == 'refs/heads/main' && !inputs.preflight_only && steps.builds.outputs.result == 'ready'
        working-directory: apps/mobile
        env:
          MESSAGE: ${{ steps.commit.outputs.message }}
        run: |
          eas update --channel "$CHANNEL" --environment production \
            --message "$MESSAGE" --json --non-interactive >"$RUNNER_TEMP/update.json"
          cat "$RUNNER_TEMP/update.json"
          group=$(jq -r '[.[]?.group] | map(select(. != null)) | first // empty' "$RUNNER_TEMP/update.json" || true)
          echo "group=$group" >>"$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          RESULT: ${{ steps.builds.outputs.result }}
          PUBLISHED: ${{ steps.publish.outcome }}
          IOS_STATUS: ${{ steps.builds.outputs.ios_status }}
          IOS_FINGERPRINT: ${{ steps.builds.outputs.ios_fingerprint }}
          ANDROID_STATUS: ${{ steps.builds.outputs.android_status }}
          ANDROID_FINGERPRINT: ${{ steps.builds.outputs.android_fingerprint }}
          GROUP: ${{ steps.publish.outputs.group }}
          MESSAGE: ${{ steps.commit.outputs.message }}
          PR: ${{ steps.commit.outputs.pr }}
        run: |
          url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          case $RESULT:$PUBLISHED in
            needs-native-build:*) title="Needs a native build — not published" ;;
            ready:success) title="Published to \`$CHANNEL\`" ;;
            ready:skipped) title="Builds found — nothing published (preflight or not main)" ;;
            *) title="OTA publish failed" ;;
          esac
          row() { echo "| $1 | ${2:-not run} | ${3:+\`$3\`} |"; }
          {
            echo "### $title"
            echo
            echo "| Platform | Production build | Fingerprint |"
            echo "| --- | --- | --- |"
            row iOS "$IOS_STATUS" "$IOS_FINGERPRINT"
            row Android "$ANDROID_STATUS" "$ANDROID_FINGERPRINT"
            echo
            echo "- Channel: \`$CHANNEL\`"
            if [ -n "$GROUP" ]; then echo "- Update group: \`$GROUP\`"; fi
            echo "- Commit: [\`${GITHUB_SHA:0:7}\`]($url/commit/$GITHUB_SHA) — $MESSAGE"
            if [ -n "$PR" ]; then echo "- PR: [#$PR]($url/pull/$PR)"; else echo "- PR: none (pushed to main directly)"; fi
            if [ "$RESULT" = needs-native-build ]; then
              echo
              echo "No finished production EAS build has this commit's native fingerprint. A maintainer builds one (docs/internal/OTA.md, Production builds); binaries keep the last update until then."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # The label and comment are the factory app's (ADR 0021), not github-actions[bot]'s.
      - name: Factory app token
        id: app
        if: always() && steps.builds.outputs.result == 'needs-native-build' && steps.commit.outputs.pr != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

      - name: Tell the merged PR it needs a native build
        if: always() && steps.builds.outputs.result == 'needs-native-build' && steps.commit.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.commit.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPO/issues/$PR/labels" -f 'labels[]=needs-native-build' >/dev/null
          gh api "repos/$GH_REPO/issues/$PR/comments" -f body="$(printf '%s\n' \
            "**Needs a native build — not published.** No finished production EAS build has the native fingerprint of \`${GITHUB_SHA:0:7}\`, so the OTA publish skipped it." \
            "" \
            "A maintainer ships a new binary (docs/internal/OTA.md). Run: $RUN_URL")" >/dev/null

      - name: Fail the run when nothing could be published
        if: always() && steps.builds.outputs.result == 'needs-native-build'
        run: exit 1
