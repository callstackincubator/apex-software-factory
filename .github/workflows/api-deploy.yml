name: API deploy

# Hosts apps/api on Cloudflare Workers (ADR 0026).
# - A push to main deploys the Worker.
# - A pull request uploads a version under the alias `pr-<number>` without
#   deploying it, and comments the preview URL on the PR.
# A pull request from a fork gets no secrets, so its job is skipped.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (docs/BOOTSTRAP.md).

on:
  pull_request:
    paths:
      - apps/api/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/api-deploy.yml
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/api-deploy.yml

permissions: {}

concurrency:
  # Deploys queue behind each other in order; a new push to a PR supersedes
  # the preview in flight.
  group: api-deploy-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: deploy
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the version from package.json's packageManager pin.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Deploy
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: deploy
      - name: Upload a preview version
        id: preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}
      - name: Preview URL
        id: url
        if: github.event_name == 'pull_request'
        env:
          OUTPUT: ${{ steps.preview.outputs.command-output }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          url=$(printf '%s\n' "$OUTPUT" | grep -oE "https://${ALIAS}-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev" | head -n1 || true)
          echo "url=$url" >>"$GITHUB_OUTPUT"
          {
            echo "### API preview"
            echo
            if [ -n "$url" ]; then echo "$url"; else echo "Uploaded as alias \`$ALIAS\`; the URL was not in Wrangler's output."; fi
          } >>"$GITHUB_STEP_SUMMARY"
      # Writes to a PR as the factory app (ADR 0021).
      - name: Factory app token
        id: app
        if: github.event_name == 'pull_request'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - name: Comment the preview URL
        if: github.event_name == 'pull_request' && steps.url.outputs.url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const marker = "<!-- api-preview -->";
            const body = `${marker}\nAPI preview: ${process.env.PREVIEW_URL}\n\nUploaded from ${context.payload.pull_request.head.sha.slice(0, 7)}. Not deployed: it serves this branch only at that URL.`;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
