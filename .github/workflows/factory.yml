name: Factory

# The dispatcher (ADR 0012): starts one unattended OpenCode run per issue on the booth laptop's
# self-hosted `factory` runners (booth-factory-1/2), so a label is all it takes.
#   - feature:ready, task:ready, bug:ready added -> deliver (the factory agent)
#   - bug:triage added                           -> triage (the triager agent)
#   - workflow_dispatch with an issue            -> either, by the issue's current label
# issue-state.yml's promotions (task:ready, bug:triage) start a run by the label: it acts as the
# factory's GitHub App, and the app's labels start workflows (ADR 0021).
#
# SECURITY: the runner runs as the maintainer's user, with OpenCode's provider credentials and
# the device pool. On GitHub the agents act as the factory's GitHub App (ADR 0020): its
# installation token, minted per job for this repository only, is the run's GH_TOKEN. It runs
# only code from main (this workflow checks out the default branch, never a PR), only for a
# label set by someone with write access or by this repository's own automation, and never on
# pull_request or pull_request_target. Do not add such a trigger.
#
# Setup (runners, SIMLOCK_BIN, OpenCode auth, the app's secrets): docs/internal/DELIVERY.md,
# "The factory dispatcher".

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to deliver or triage
        required: true
        type: string

permissions: {}

# One run per issue at a time; a second trigger for the same issue waits instead of racing the
# first one for the claim. A running delivery is never cut off.
concurrency:
  group: factory-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  run:
    name: ${{ github.event.issue.number && format('#{0}', github.event.issue.number) || format('#{0}', inputs.issue) }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJSON('["feature:ready","task:ready","bug:ready","bug:triage"]'), github.event.label.name)
    runs-on: [self-hosted, factory]
    # The app token lasts an hour; factory-run.sh ends the run five minutes before it expires.
    timeout-minutes: 75
    permissions:
      contents: read
      issues: read
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      SENDER: ${{ github.event.sender.login || github.actor }}
      APEX_DISPATCH: "1"
      AGENT_DEVICE_NO_UPDATE_NOTIFIER: "1"
    steps:
      # The factory's GitHub identity (ADR 0020): an installation token of the factory app, for
      # this repository only, revoked when the job ends. It expires after an hour, which bounds
      # the run (factory-run.sh reads FACTORY_TOKEN_EXPIRES, set right after it).
      - name: Factory app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

      - name: Check who asked
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          echo "FACTORY_TOKEN_EXPIRES=$(($(date +%s) + 3600))" >>"$GITHUB_ENV"
          case $ISSUE in '' | *[!0-9]*) echo "::error::not an issue number: $ISSUE"; exit 1 ;; esac
          # The repository's own automation: issue-state.yml labels as the factory app (ADR 0021).
          if [ "$SENDER" = "$APP_BOT" ] || [ "$SENDER" = "github-actions[bot]" ]; then
            echo "Started by this repository's automation ($SENDER)."
            exit 0
          fi
          permission=$(gh api "repos/$GH_REPO/collaborators/$SENDER/permission" -q .permission 2>/dev/null || echo none)
          case $permission in
            admin | maintain | write) echo "Started by $SENDER ($permission)." ;;
            *)
              echo "::error::$SENDER has '$permission' access; only people with write access start the factory."
              exit 1
              ;;
          esac

      - name: Decide what to run
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          labels=$(gh issue view "$ISSUE" --json state,labels -q 'select(.state == "OPEN") | .labels[].name')
          if printf '%s\n' "$labels" | grep -qxE '(feature|task|bug):ready'; then
            echo "mode=deliver" >>"$GITHUB_OUTPUT"
          elif printf '%s\n' "$labels" | grep -qx 'bug:triage'; then
            echo "mode=triage" >>"$GITHUB_OUTPUT"
          else
            echo "#$ISSUE is closed or carries no label agents act on (now: $(echo $labels)); nothing to do."
            echo "mode=none" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.what.outputs.mode != 'none'
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          # The agents push with the factory app's token (below). The workflow token must not be
          # left in the git config: a push made with it would start no CI on the PR.
          persist-credentials: false
          fetch-depth: 0

      - name: Put Node, pnpm, gh and opencode on PATH
        if: steps.what.outputs.mode != 'none'
        run: |
          scripts/ci/runner-env.sh
          for dir in "$HOME/.opencode/bin" /opt/homebrew/bin; do
            [ -d "$dir" ] && echo "$dir" >>"$GITHUB_PATH"
          done

      # Run the factory from the newest main, not the commit that was main when the label
      # event fired: a run that waited in the queue, or a re-run of an old run, would otherwise
      # deliver with yesterday's skills and scripts. The checkout above cleans the directory,
      # so worktrees left by an earlier run are pruned here.
      - name: Newest main, clean worktree list
        if: steps.what.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # The agents' fetches and pushes authenticate with GH_TOKEN, the app's token, through
          # gh's credential helper. Local config only, shared by every worktree: not
          # `gh auth setup-git`, which would rewrite the runner user's global git config.
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config --local credential.https://github.com.helper ""
          git config --local --add credential.https://github.com.helper "!$(command -v gh) auth git-credential"
          gh api "repos/$GITHUB_REPOSITORY" --silent || { echo "::error::the factory app's token cannot read $GITHUB_REPOSITORY"; exit 1; }
          git fetch --quiet origin main
          git checkout --quiet --detach origin/main
          git worktree prune
          echo "factory code: main at $(git rev-parse --short HEAD)"
          echo "- Factory code: \`main\` at \`$(git rev-parse --short HEAD)\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Install
        if: steps.what.outputs.mode != 'none'
        run: |
          pnpm install --frozen-lockfile
          command -v opencode >/dev/null || { echo "::error::opencode not found on the runner"; exit 1; }
          opencode --version
          # simlock is not on npm yet: the lanes run the CLI named by SIMLOCK_BIN, set in the
          # runner's .env file (docs/internal/DELIVERY.md).
          [ -n "${SIMLOCK_BIN:-}" ] && echo "simlock: SIMLOCK_BIN set${SIMLOCK_HOME:+, SIMLOCK_HOME=$SIMLOCK_HOME}" \
            || echo "::warning::SIMLOCK_BIN is not set on this runner: simulator checks will report unavailable."

      - name: Run the factory
        id: factory
        if: steps.what.outputs.mode != 'none'
        env:
          MODE: ${{ steps.what.outputs.mode }}
          # Every gh and git call of the run, the agents' included, is the app's bot.
          GH_TOKEN: ${{ steps.app.outputs.token }}
          FACTORY_APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          unset GITHUB_TOKEN
          if [ "$MODE" = triage ]; then
            .agents/scripts/factory-run.sh --triage "$ISSUE"
          else
            .agents/scripts/factory-run.sh "$ISSUE"
          fi

      # The run's logs, journals, digests and transcripts (ADR 0016). The next job's checkout
      # cleans .worktrees/, so without this they are gone; with it, the retro reads them from
      # any machine (`gh run download`). The digests are also on the factory-memory branch.
      - name: Keep the run record
        if: always() && steps.what.outputs.mode != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-run-${{ env.ISSUE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .worktrees/factory-runs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always() && steps.what.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ steps.what.outputs.mode }}
          OUTCOME: ${{ steps.factory.outcome }}
        run: |
          url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          title=$(gh issue view "$ISSUE" --json title -q .title 2>/dev/null || echo "")
          labels=$(gh issue view "$ISSUE" --json labels -q '[.labels[].name] | join(", ")' 2>/dev/null || echo "")
          prs=$(gh pr list --state all --search "$ISSUE in:body" --json number,state,headRefName \
            -q ".[] | select(.headRefName | test(\"^(task|bug|feature)/$ISSUE$\")) | \"[#\(.number)]($url/pull/\(.number)) (\(.state | ascii_downcase))\"" 2>/dev/null | paste -sd ' ' -)
          {
            echo "### Factory $MODE: [#$ISSUE]($url/issues/$ISSUE) $title"
            echo
            echo "- Result: $OUTCOME"
            echo "- PR: ${prs:-none}"
            echo "- Labels now: ${labels:-none}"
            echo "- Run record: \`.agents/scripts/memory.sh runs --issue $ISSUE\`; logs and transcripts in this run's artifact \`factory-run-$ISSUE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\`"
          } >>"$GITHUB_STEP_SUMMARY"
